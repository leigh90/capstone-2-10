version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt
  pre-build:
    commands:
      - echo "Running tests"
  build: 
    commands:
      - echo "Building the project"
      - python setup.py build
  post_build:
    commands:
      - echo "Build completed successfully"
artifacts:
  files:
    - '**/*'