version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Logging into AWS..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 776657383134.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=776657383134.dkr.ecr.us-east-1.amazonaws.com/capstone-two-test
      - IMAGE_TAG=latest
  build:
    commands:
      - echo "Building the docker image..."
      - docker build -t 776657383134.dkr.ecr.us-east-1.amazonaws.com/capstone-two-test:latest
      - printf '[{"name":"python-container","imageUri":"%s"}]' 776657383134.dkr.ecr.us-east-1.amazonaws.com/capstone-two-test:latest > imagedetails.json
  post_build:
    commands:
      - echo "Build completed successfully"
artifacts:
  files:
    - "**/*"
    - imagedetails.json

